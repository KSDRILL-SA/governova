name: PR Guardian

# A consolidated governance verdict for every pull request, rendered in the job summary
# (no bot comments): overall Governova Score, this PR's enforcement result, and coverage.
# Advisory — reporting only; the Constitutional Enforcement workflow remains the gate.

on:
  pull_request:
    branches: [main, Dev]

permissions:
  contents: read
  # Lets the built-in token reach the platform's own free inference endpoint, which
  # is the semantic tier's default when no endpoint is configured (see below).
  models: read

jobs:
  guardian:
    name: Governova Guardian
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync the Governova engine
        shell: bash
        run: uv sync --all-packages

      - name: Governova Guardian verdict
        shell: bash
        run: uv run governova guard --base "${{ github.event.pull_request.base.sha }}"

      # Advisory semantic review — never blocks, and the reliable tiers above are
      # unaffected by anything that happens here.
      #
      # There is no default endpoint (ADR-008). This step previously fell back to the
      # platform's own free inference API, which was **fully retired on 2026-07-30**;
      # the fallback returned HTTP 410 and the tier silently reached nothing for two
      # releases while every build stayed green.
      #
      # It was removed rather than replaced. Every remaining provider needs an account
      # and a credential, so no substitute restores the property that made a default
      # possible — it would only pick a vendor on the adopter's behalf and re-create a
      # dependency this project cannot monitor (S8.87). A default that lies is worse
      # than no default, because it turns an absent capability into a believed one.
      #
      # With no secrets set the tier reports `inactive` and this step is a no-op.
      # Configure any endpoint speaking `chat_completions` or `messages` — including a
      # local OpenAI-compatible server, which is the zero-cost, offline route.
      #
      # The gate is unaffected either way: an advisory tier never changes a build
      # result (REQ-008), and since #153 it says which of the two happened.
      - name: Advisory semantic review (optional)
        if: always()
        shell: bash
        env:
          GOVERNOVA_LLM_BASE_URL: ${{ secrets.GOVERNOVA_LLM_BASE_URL }}
          GOVERNOVA_LLM_MODEL: ${{ secrets.GOVERNOVA_LLM_MODEL }}
          GOVERNOVA_LLM_API_KEY: ${{ secrets.GOVERNOVA_LLM_API_KEY }}
          GOVERNOVA_LLM_PROTOCOL: ${{ secrets.GOVERNOVA_LLM_PROTOCOL }}
          GOVERNOVA_LLM_API_VERSION: ${{ secrets.GOVERNOVA_LLM_API_VERSION }}
        run: >
          uv run governova-enforce
          --changed
          --base "${{ github.event.pull_request.base.sha }}"
          --mode advisory
          --semantic
          --format github
