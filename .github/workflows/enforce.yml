name: Constitutional Enforcement

# The enforcement wedge, dogfooded: Governova governs Governova. Every pull request
# is scanned for constitutional violations in its changed files, and a violation
# blocks the merge.

on:
  pull_request:
    branches: [main, Dev]

jobs:
  enforce:
    name: Enforce the constitution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for the diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Governova Constitutional Enforcer
        uses: ./platform/surfaces/cicd-enforcer
        with:
          mode: block
          base: ${{ github.event.pull_request.base.sha }}
          # Governova governs itself with the engine and constitution in the
          # branch under review, never with a published build — a PR that
          # amends the constitution must be judged by the amendment it proposes.
          version: source

      # Non-blocking report: the headline Governova Score, posted to the job summary.
      - name: Governova Score (report)
        if: always()
        shell: bash
        run: uv run governova govscore --format markdown
