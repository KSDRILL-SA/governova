# Governova pre-commit hooks. Install with: uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        pass_filenames: true

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
        pass_filenames: true

      - id: governova-compile
        name: governova compile (regenerate index)
        entry: uv run governova-compile --quiet
        language: system
        files: ^(constitution/|framework/|governance/|scripts/governova_compile/).*
        pass_filenames: false

      - id: governova-validate
        name: governova validate (integrity)
        entry: uv run governova-validate
        language: system
        files: ^(constitution/|framework/|governance/|compiled/).*
        pass_filenames: false
