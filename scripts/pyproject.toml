[project]
name = "governova-scripts"
version = "0.1.0"
description = "Compile, validate, and codegen for the Governova constitutional database"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Maluleke Kurhula Success" }]
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.9",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
governova-compile = "governova_compile.__main__:app"
governova-validate = "governova_validate.__main__:app"
governova-codegen = "governova_codegen.__main__:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "governova_compile",
    "governova_validate",
    "governova_codegen",
]
