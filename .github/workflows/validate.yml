name: Constitutional Integrity

on:
  pull_request:
    branches: [main, Dev]
  push:
    branches: [main, Dev]

jobs:
  validate:
    name: Compile & validate constitution
    runs-on: ubuntu-latest

    # Stage 1's persistence is the one part of this repository that cannot be
    # checked without a server. `test_store.py` covers the reasoning — migration
    # ordering, checksum refusal, the two concurrency branches — against a fake
    # connection, and deliberately refuses to claim the rest: that the committed
    # SQL is valid PostgreSQL, that the constraints exist once it has run, and
    # that an entry's hash survives a round trip through `timestamptz`.
    #
    # Those assertions skip locally with the reason stated rather than passing,
    # because a check that cannot determine an answer returns `unknown` and never
    # `satisfied`. This service is what turns them from skipped to answered.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: governova_test
          POSTGRES_DB: governova_test
        ports:
          - 5432:5432
        # Without this the job races the server: the first connection arrives
        # before PostgreSQL is accepting them, and the failure reads like a
        # broken test rather than a slow container.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      GOVERNOVA_TEST_DATABASE_URL: postgresql://postgres:governova_test@localhost:5432/governova_test

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync --all-packages --all-extras

      - name: Lint (ruff)
        run: uv run ruff check scripts/

      - name: Type-check (mypy)
        working-directory: scripts
        run: uv run mypy

      # The engine is the authoritative integrity gate — it parses all 670
      # standards into the compiled index and validates them structurally.

      - name: Engine — verify committed index is current (drift check)
        run: uv run governova-compile --check

      # The generated `governova-types` package is committed so consumers can read
      # it without running the generator — which only holds if CI proves the
      # committed copy still matches `schema.py`.
      - name: Engine — verify generated types are current (drift check)
        run: uv run governova-codegen --check

      - name: Engine — structural integrity
        run: uv run governova-validate

      # S7.25 — the threshold is what makes this a gate rather than a number.
      # `fail_under = 80` lives in the root `pyproject.toml` so this command and a
      # local run cannot disagree about what passing means.
      - name: Engine — unit tests + coverage gate (S7.25)
        run: uv run pytest scripts/tests/ -q --cov --cov-report=term --cov-report=xml

      # S7.27 — the gate above fails the build on a *total*. It cannot show a
      # reviewer which added lines are untested, and that is the question review
      # exists to answer. Without this, the answer depended on whether the author
      # remembered to mention it.
      #
      # `if: always()` because the run worth reading most is the one that failed.
      - name: Publish the coverage report (S7.27)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 14
          if-no-files-found: warn

      # Secondary cross-check: the regex validator confirms every S{C}.{N}
      # reference across the repo resolves (defence in depth).
      - name: Cross-check references (regex validator)
        run: uv run python scripts/validate-integrity.py
