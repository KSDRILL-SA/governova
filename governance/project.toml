# ── Approved exceptions ──────────────────────────────────────────────────────
# Each must cite an ADR that exists in governance/decisions/.

[[exception]]
standard = "S5.3"
adr = "ADR-005"
reason = "Governova's local engine holds no financial data and no database at all — the constitutional store is a committed JSON index. The standard is in force for every system Governova governs; it has no subject here."
