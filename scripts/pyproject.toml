[project]
name = "governova"
version = "0.1.0"
description = "Constitutional governance for AI-assisted development — enforce engineering standards as a merge gate"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Maluleke Kurhula Success" }]
license = { text = "MIT" }
keywords = [
    "governance", "code-quality", "static-analysis", "ci", "ai",
    "engineering-standards", "compliance", "linting", "architecture",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.9",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "typer>=0.12",
    "rich>=13.7",
    "mcp>=1.2",
]

[project.urls]
Homepage = "https://github.com/KSDRILL-SA/governova"
Repository = "https://github.com/KSDRILL-SA/governova"
Issues = "https://github.com/KSDRILL-SA/governova/issues"

[project.scripts]
governova = "governova_cli.__main__:app"
governova-mcp = "governova_mcp.__main__:main"
governova-compile = "governova_compile.__main__:app"
governova-validate = "governova_validate.__main__:app"
governova-codegen = "governova_codegen.__main__:app"
governova-enforce = "governova_enforce.__main__:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The compiled constitution ships inside the wheel, so an installed `governova`
# carries its own corpus and governs any repository without the source tree on
# disk. It is included at build time from the single committed copy rather than
# duplicated into the package directory — one constitution, one file, no drift.
[tool.hatch.build.targets.wheel.force-include]
"../compiled/constitution.json" = "governova_compile/data/constitution.json"

[tool.hatch.build.targets.wheel]
packages = [
    "governova_cli",
    "governova_mcp",
    "governova_compile",
    "governova_validate",
    "governova_codegen",
    "governova_checks",
    "governova_enforce",
    "governova_score",
    "governova_report",
    "governova_bible",
    "governova_semantic",
    "governova_dashboard",
    "governova_guardian",
    "governova_notify",
    "governova_handoff",
    "governova_audit",
    "governova_relay",
    "governova_project",
    "governova_evidence",
    "governova_supply",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = [
    "governova_checks",
    "governova_score",
    "governova_report",
    "governova_bible",
    "governova_guardian",
    "governova_notify",
    "governova_dashboard",
    "governova_semantic",
    "governova_enforce",
    "governova_cli",
    "governova_compile",
    "governova_validate",
    "governova_mcp",
    "governova_codegen",
    "governova_handoff",
    "governova_audit",
    "governova_relay",
    "governova_project",
    "governova_evidence",
    "governova_supply",
]
