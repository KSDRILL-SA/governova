name: Board Governance Report

# The §18.3 artifact, auto-generated: a one-page, plain-English governance report
# for the board, the regulator, and the data room — monthly, and on demand.

on:
  schedule:
    - cron: "0 9 1 * *" # 09:00 UTC on the 1st of every month
  workflow_dispatch:

jobs:
  report:
    name: Generate the board report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync the Governova engine
        shell: bash
        run: uv sync --all-packages

      - name: Generate the Board-Level Governance Report (§18.3)
        shell: bash
        run: uv run governova report --out governance-report.md

      - name: Generate the System Bible (§18.4)
        shell: bash
        run: uv run governova bible --out system-bible.md

      - name: Generate the governance dashboard (HTML)
        shell: bash
        run: uv run governova dashboard --out dashboard.html

      - name: Upload the governance outputs
        uses: actions/upload-artifact@v4
        with:
          name: governance-outputs
          path: |
            governance-report.md
            system-bible.md
            dashboard.html

      # No-op unless the GOVERNOVA_WEBHOOK_URL secret is set.
      - name: Notify chat (optional)
        shell: bash
        env:
          GOVERNOVA_WEBHOOK_URL: ${{ secrets.GOVERNOVA_WEBHOOK_URL }}
        run: uv run governova notify --base "HEAD~1"
