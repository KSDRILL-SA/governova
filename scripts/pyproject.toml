[project]
name = "governova"
version = "0.2.0"
description = "Constitutional governance for AI-assisted development — enforce engineering standards as a merge gate"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Maluleke Kurhula Success" }]
license = { text = "MIT" }
keywords = [
    "governance", "code-quality", "static-analysis", "ci", "ai",
    "engineering-standards", "compliance", "linting", "architecture",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.9",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "typer>=0.12",
    "rich>=13.7",
    # Floor raised from >=1.2 by the CVE gate's first run: 1.28.0 carries
    # PYSEC-2026-3483, fixed in 1.28.1. A lower bound that permits a known-
    # vulnerable release is a lower bound that will eventually resolve to one.
    #
    # The `<2` cap is lifted. It was correct when it was added — 2.0 removes
    # `mcp.server.fastmcp`, and taking a security patch and an API migration in
    # one step would have coupled an urgent fix to a discretionary rewrite. The
    # migration is done now, so the cap has stopped protecting the server and
    # started blocking 2.x security patches, which is the opposite of its purpose.
    #
    # The new floor is 2.0.0 rather than a range spanning both majors: the surface
    # imports `mcp.server.mcpserver`, which does not exist in 1.x, so a resolver
    # permitted to choose 1.x would produce an ImportError at startup rather than
    # a resolution failure at install time.
    "mcp>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/KSDRILL-SA/governova"
Repository = "https://github.com/KSDRILL-SA/governova"
Issues = "https://github.com/KSDRILL-SA/governova/issues"

[project.scripts]
governova = "governova_cli.__main__:app"
governova-mcp = "governova_mcp.__main__:main"
governova-compile = "governova_compile.__main__:app"
governova-validate = "governova_validate.__main__:app"
governova-codegen = "governova_codegen.__main__:app"
governova-enforce = "governova_enforce.__main__:app"
governova-ingest = "governova_ingest.__main__:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
# `pypdf` backs one maintainer command (`governova-ingest`) used to read the Phase 2
# source corpus. It is an extra rather than a runtime dependency because governing a
# consumer's repository never reads a PDF, and a governance tool that pulls a document
# parser into every install is carrying weight its users did not ask for. The legacy
# `.doc` path needs nothing beyond the standard library.
ingest = [
    "pypdf>=5.0",
]
# The identity service (Workstream D, Stage 0). An extra rather than a runtime
# dependency for the same reason `ingest` is one, and for a stronger one:
# `ADR-010` §1 and §5.1 guarantee the deterministic engine runs complete and
# offline forever. A consumer who installs `governova` to govern a repository
# must never acquire a web framework, an ASGI server and a JWT library to do it.
#
# The separation is asserted, not assumed — `test_identity_isolation.py` imports
# every engine surface with these packages made unimportable.
cloud = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pyjwt>=2.9",
    "cryptography>=43.0",
]
# The identity *client* — `governova login`, `logout`, `whoami`. Separate from
# `cloud` because a client and a service are different things: someone logging
# in from a laptop needs a keychain, and has no use for a web framework, an ASGI
# server or a cryptography stack.
#
# `keyring` and nothing else. The HTTP calls use `urllib` from the standard
# library rather than adding a client, because every package added here is one
# the user did not ask for.
auth = [
    "keyring>=25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The compiled constitution ships inside the wheel, so an installed `governova`
# carries its own corpus and governs any repository without the source tree on
# disk. It is included at build time from the single committed copy rather than
# duplicated into the package directory — one constitution, one file, no drift.
#
# The wheel side is done by a hook (`hatch_build.py`) rather than a static
# force-include, because the file's location differs between building in the
# repository and building from an sdist, and `uv build` does the latter. The
# sdist carries its own copy so that a wheel built from it can still find one.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist.force-include]
# The *core* index is what a wheel bundles (ADR-011 §1), so it is what an sdist
# must carry for a wheel built from that sdist to find one. The full corpus is
# deliberately not included: an sdist carrying it would hand over the licensed
# artefact to anyone installing with `--no-binary`, which is the whole boundary
# this mechanism exists to draw.
"../compiled/constitution.core.json" = "compiled/constitution.core.json"

[tool.hatch.build.targets.wheel]
packages = [
    "governova_cli",
    "governova_mcp",
    "governova_compile",
    "governova_validate",
    "governova_codegen",
    "governova_checks",
    "governova_enforce",
    "governova_score",
    "governova_report",
    "governova_bible",
    "governova_semantic",
    "governova_dashboard",
    "governova_guardian",
    "governova_notify",
    "governova_handoff",
    "governova_audit",
    "governova_relay",
    "governova_project",
    "governova_evidence",
    "governova_supply",
    "governova_ingest",
    "governova_requirements",
    "governova_schema",
    "governova_console",
    "governova_onboard",
    "governova_identity",
    "governova_auth",
    "governova_org",
    "governova_settings",
]

[tool.mypy]
python_version = "3.12"
# The root `pyproject.toml` has declared `strict = true` since it was written, and
# CI never ran under it: `mypy` reads the config in its working directory, CI runs
# `working-directory: scripts`, and this file is the one it finds. So the repository
# declared strict typing, enforced ordinary typing, and stayed green — the same
# shape as a semantic tier that reached nothing while every build passed.
#
# Enabled here, where CI actually reads it. The four errors it surfaced are fixed
# in the same change; a declaration whose enforcement is switched off is worse than
# no declaration, because it is believed.
strict = true
ignore_missing_imports = true
files = [
    "governova_checks",
    "governova_score",
    "governova_report",
    "governova_bible",
    "governova_guardian",
    "governova_notify",
    "governova_dashboard",
    "governova_semantic",
    "governova_enforce",
    "governova_cli",
    "governova_compile",
    "governova_validate",
    "governova_mcp",
    "governova_codegen",
    "governova_handoff",
    "governova_audit",
    "governova_relay",
    "governova_project",
    "governova_evidence",
    "governova_supply",
    "governova_ingest",
    "governova_requirements",
    "governova_schema",
    "governova_console",
    "governova_onboard",
    "governova_identity",
    "governova_auth",
    "governova_org",
    "governova_settings",
]
