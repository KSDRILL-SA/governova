name: Constitutional Integrity

on:
  pull_request:
    branches: [main, Dev]
  push:
    branches: [main, Dev]

jobs:
  validate:
    name: Compile & validate constitution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync --all-packages --all-extras

      - name: Lint (ruff)
        run: uv run ruff check scripts/

      - name: Type-check (mypy)
        working-directory: scripts
        run: uv run mypy

      # The engine is the authoritative integrity gate — it parses all 670
      # standards into the compiled index and validates them structurally.

      - name: Engine — verify committed index is current (drift check)
        run: uv run governova-compile --check

      # The generated `governova-types` package is committed so consumers can read
      # it without running the generator — which only holds if CI proves the
      # committed copy still matches `schema.py`.
      - name: Engine — verify generated types are current (drift check)
        run: uv run governova-codegen --check

      - name: Engine — structural integrity
        run: uv run governova-validate

      # S7.25 — the threshold is what makes this a gate rather than a number.
      # `fail_under = 80` lives in the root `pyproject.toml` so this command and a
      # local run cannot disagree about what passing means.
      - name: Engine — unit tests + coverage gate (S7.25)
        run: uv run pytest scripts/tests/ -q --cov --cov-report=term

      # Secondary cross-check: the regex validator confirms every S{C}.{N}
      # reference across the repo resolves (defence in depth).
      - name: Cross-check references (regex validator)
        run: uv run python scripts/validate-integrity.py
