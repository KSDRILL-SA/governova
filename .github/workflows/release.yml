name: Release

# Publishes `governova` to PyPI via OIDC Trusted Publishing.
#
# No API token exists anywhere in this repository. GitHub proves its own identity
# to PyPI at publish time, so there is no long-lived credential to leak, rotate,
# or accidentally scope too widely. The trust is registered on PyPI against this
# owner, this repository, this workflow filename, and the `pypi` environment —
# change any of those four and publishing stops working, by design.
#
# Triggered by a tag, never by a merge. Publishing is a deliberate act.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify without publishing."
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # ── Gate ────────────────────────────────────────────────────────────────────
  # A release that fails its own constitution is not a release. Everything that
  # guards `main` runs again here against the exact commit being shipped, because
  # a tag can point at anything.
  verify:
    name: Verify the release candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Sync from the committed lockfile
        run: uv sync --all-packages --all-extras --frozen

      - name: The tag must match the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          packaged=$(uv run python -c \
            "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('scripts/pyproject.toml').read_text())['project']['version'])")
          if [ "$tag" != "$packaged" ]; then
            echo "::error::tag v${tag} does not match scripts/pyproject.toml version ${packaged}"
            exit 1
          fi
          echo "tag v${tag} matches the packaged version"

      # The changelog is the only place a release explains itself, and its date is
      # the one field that cannot be written truthfully in advance: preparation
      # says `unreleased` because at that moment it is, and the tag goes out
      # separately. Nobody goes back.
      #
      # It has happened on both releases cut since the changelog existed. `0.2.1`
      # shipped on 2026-08-22 and was still marked `unreleased` the next day;
      # `0.2.2` was dated only because someone went looking for the same mistake
      # an hour after publishing. Twice is a process gap rather than an oversight,
      # so the check moves to where the date first becomes knowable.
      #
      # Blocking rather than warning: an undated entry is indistinguishable from
      # an entry for a version that never shipped, and the reader most likely to
      # be misled is the one deciding whether to upgrade.
      - name: The changelog must say this version shipped
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          uv run python - "${GITHUB_REF_NAME#v}" <<'CHECK'
          import pathlib
          import re
          import sys

          version = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")

          # `## [0.2.2] - 2026-08-23`, with any dash and any spacing.
          heading = re.search(
              rf"^##\s+\[{re.escape(version)}\]\s*[-–—]\s*(.+?)\s*$",
              text,
              re.MULTILINE,
          )
          if heading is None:
              print(f"::error::CHANGELOG.md has no entry for {version}")
              raise SystemExit(1)

          stated = heading.group(1)
          if not re.fullmatch(r"\d{4}-\d{2}-\d{2}", stated):
              print(
                  f"::error::CHANGELOG.md dates {version} as '{stated}'. A released "
                  f"version needs an ISO date; 'unreleased' is what the entry says "
                  f"while it is being prepared, and this tag is publishing it."
              )
              raise SystemExit(1)

          print(f"CHANGELOG.md dates {version} as {stated}")
          CHECK

      - name: Lint
        run: uv run ruff check scripts/

      - name: Type-check
        working-directory: scripts
        run: uv run mypy

      - name: Tests
        run: uv run pytest scripts/tests -q

      - name: Constitutional index is current
        run: uv run governova-compile --check

      - name: Generated types are current
        run: uv run governova-codegen --check

      - name: Structural integrity
        run: uv run governova-validate

      # S8.84, and the one gate `verify` used to omit. The advisory database moves
      # without this repository moving, so a tag cut during a red Supply Chain week
      # would otherwise publish a lockfile that Governova blocks in the CI of every
      # project it governs. `main` being green when the commit was merged is not
      # evidence about the day it ships.
      #
      # Copied from `supply-chain.yml` rather than shared as a composite action: at
      # two call sites the indirection would hide what a release actually checks,
      # and what a release checks should be readable in one file.
      - name: Audit dependencies for known vulnerabilities (S8.84)
        run: |
          set -euo pipefail
          uv export --frozen --all-packages --no-emit-workspace --no-hashes \
            --format requirements-txt > /tmp/reqs.txt
          uvx pip-audit --requirement /tmp/reqs.txt --strict --progress-spinner off

      - name: Dependency licences (S8.85)
        run: uv run governova licences --sbom sbom.cyclonedx.json

      - name: Build the distributions
        run: uv build --package governova --out-dir dist/

      # The bundled constitution is what lets an installed `governova` govern a
      # repository that does not contain one. A wheel without it installs fine
      # and then fails on first use, so it is checked here rather than discovered
      # by whoever installs it first.
      - name: The wheel must carry the core constitution, and only the core
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import glob, json, sys, tomllib, zipfile
          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          archive = zipfile.ZipFile(wheel)
          bundled = "governova_compile/data/constitution.json"
          if bundled not in archive.namelist():
              sys.exit(f"::error::{wheel} does not bundle {bundled}")

          # ADR-011 §1 — the free wheel carries the core subset. Checking that a
          # file is *present* proves the wheel works; it does not prove the
          # licence holds. Publishing the full corpus would install cleanly, work
          # perfectly, and give away the product — a failure nobody would notice
          # from the outside. So the boundary is asserted against the manifest
          # rather than against a number written here.
          manifest = tomllib.loads(open("governance/core-subset.toml", "rb").read().decode())
          expected = {c.upper() for c in manifest["core"]["constitutions"]}

          index = json.loads(archive.read(bundled).decode("utf-8"))
          shipped = {c["id"].upper() for c in index["constitutions"]}
          standards = sum(len(c["standards"]) for c in index["constitutions"])

          if shipped != expected:
              extra = ", ".join(sorted(shipped - expected)) or "none"
              missing = ", ".join(sorted(expected - shipped)) or "none"
              sys.exit(
                  f"::error::{wheel} bundles the wrong corpus. "
                  f"Unlicensed content present: {extra}. Missing from core: {missing}."
              )
          if index["domains"]:
              packs = ", ".join(d["id"] for d in index["domains"])
              sys.exit(f"::error::{wheel} bundles domain pack(s) {packs}; those are never free.")

          size = archive.getinfo(bundled).file_size
          print(
              f"{wheel} bundles the core corpus: {standards} standards across "
              f"{', '.join(sorted(shipped))} ({size:,} bytes)"
          )
          PY

      # Proves the artifact works before it is published, not after: install the
      # wheel into a clean environment with no repository around it and confirm
      # it reads its own constitution.
      - name: The built wheel must work with no repository present
        run: |
          set -euo pipefail
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          mkdir -p /tmp/elsewhere && cd /tmp/elsewhere
          /tmp/smoke/bin/governova stats

      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: |
            dist/
            sbom.cyclonedx.json

  # ── Publish ─────────────────────────────────────────────────────────────────
  publish:
    name: Publish to PyPI
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-latest
    # The environment is the access boundary. Without it, anyone who can push a
    # workflow to this repository could publish under the project's name; with
    # it, publishing is gated separately from commit access.
    environment:
      name: pypi
      url: https://pypi.org/p/governova
    permissions:
      # The OIDC token that PyPI verifies. This is the entire credential.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
