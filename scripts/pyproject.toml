[project]
name = "governova-scripts"
version = "0.1.0"
description = "Compile, validate, and codegen for the Governova constitutional database"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Maluleke Kurhula Success" }]
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.9",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "typer>=0.12",
    "rich>=13.7",
    "mcp>=1.2",
]

[project.scripts]
governova = "governova_cli.__main__:app"
governova-mcp = "governova_mcp.__main__:main"
governova-compile = "governova_compile.__main__:app"
governova-validate = "governova_validate.__main__:app"
governova-codegen = "governova_codegen.__main__:app"
governova-enforce = "governova_enforce.__main__:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "governova_cli",
    "governova_mcp",
    "governova_compile",
    "governova_validate",
    "governova_codegen",
    "governova_checks",
    "governova_enforce",
    "governova_score",
    "governova_report",
    "governova_bible",
    "governova_semantic",
    "governova_dashboard",
    "governova_guardian",
    "governova_notify",
    "governova_handoff",
    "governova_audit",
    "governova_relay",
    "governova_project",
    "governova_evidence",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = [
    "governova_checks",
    "governova_score",
    "governova_report",
    "governova_bible",
    "governova_guardian",
    "governova_notify",
    "governova_dashboard",
    "governova_semantic",
    "governova_enforce",
    "governova_cli",
    "governova_compile",
    "governova_validate",
    "governova_mcp",
    "governova_codegen",
    "governova_handoff",
    "governova_audit",
    "governova_relay",
    "governova_project",
    "governova_evidence",
]
