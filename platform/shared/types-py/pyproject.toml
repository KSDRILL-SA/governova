[project]
name = "governova-types"
version = "0.1.0"
description = "Generated Pydantic models for the Governova compiled constitutional index"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Maluleke Kurhula Success" }]
license = { text = "MIT" }
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["governova_types"]
