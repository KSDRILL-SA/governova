[project]
# The workspace root is not published (`package = false` below) — it exists only
# to hold the uv workspace and the shared tool configuration. The name
# `governova` belongs to the distributable engine in `scripts/`, so this one
# yields it: two workspace members cannot share a name.
name = "governova-workspace"
version = "0.2.0"
description = "Governova — AI Development Governance Platform (monorepo root)"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Maluleke Kurhula Success" }]
license = { text = "MIT" }
dependencies = []

[tool.uv.workspace]
members = [
    "scripts",
    "platform/shared/types-py",
]

[tool.uv]
package = false

[tool.ruff]
# S1.73 — "Python files: 88-character line length (Ruff/Black standard). Both
# configured in the tool configuration files — never manually managed." This file
# declared 100, which is the TypeScript half of that standard applied to Python.
#
# It is not only a declaration. `E501` is ignored below and `ruff format` is not
# run in CI, so the obvious expectation is that this value governs nothing — but
# `I001` (import sorting) uses it to decide when an import line must wrap, and
# lowering it to 88 produced ten real `ruff check` failures across nine files.
# The setting was load-bearing in a way nobody had noticed.
line-length = 88
target-version = "py312"
extend-exclude = ["compiled", "platform/shared/types-ts", ".venv"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "N",    # pep8-naming
    "C4",   # flake8-comprehensions
]
ignore = [
    # Line length is declared above and not enforced here. Measured on this tree:
    # 794 lines exceed 88 and 115 already exceed the 100 that was declared before
    # it — so E501 has never been holding anything. Turning it on is a real
    # decision with a measured blast radius, not a tidy-up, and it is not folded
    # into a one-line config correction. `ruff format` must not be run repo-wide
    # to achieve it either: CI runs `ruff check` only, and a reformat would rewrite
    # the tree under a gate that never asked for it.
    "E501",     # line too long — see above; enforcing this is a separate decision
    "RUF001",   # ambiguous unicode (em-dash etc. are intentional — they are the source format)
    "RUF002",   # ambiguous unicode in docstrings
    "RUF003",   # ambiguous unicode in comments
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["N802", "N803"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true
exclude = ["compiled", "platform/shared/types-ts", ".venv"]

[[tool.mypy.overrides]]
module = ["markdown_it.*", "mdit_py_plugins.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["scripts/tests", "platform/engine/tests"]

# S7.25 — "Minimum coverage thresholds enforced by CI … Python/FastAPI
# (pytest-cov): 80% line coverage. Dropping below these thresholds fails the
# build." The structural probe for that standard reported this repository as
# violating it, which was true: coverage was measured by nobody and gated by
# nothing.
#
# 80 is the number the standard sets, not a number chosen to be comfortable.
# Engine coverage measures 81% at the time of writing, so the headroom is one
# point — which is what a floor is supposed to feel like.
[tool.coverage.run]
source = ["scripts"]
omit = [
    # Test code inflates the figure toward 100% and says nothing about whether
    # the engine is covered. Measuring it would make the gate meaningless.
    "*/tests/*",
    # A standalone maintainer script and the wheel build hook — neither is
    # engine code reached by the unit suite.
    "*/validate-integrity.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
